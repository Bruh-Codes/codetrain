<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lesson 05 - Events</title>
		<script src="./index.js" defer></script>
		<style>
			:root {
				--page-bg: #fbf2ec;
				--panel-bg: #fffaf6;
				--card-bg: #ffffff;
				--text-main: #2f221c;
				--text-soft: #776157;
				--accent: #dd6b39;
				--accent-soft: #f9dfd2;
				--border: #edd6ca;
				--shadow: 0 24px 60px rgba(106, 58, 32, 0.14);
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				font-family: Tahoma, "Segoe UI", sans-serif;
				background:
					radial-gradient(circle at bottom left, rgba(221, 107, 57, 0.14), transparent 28%),
					linear-gradient(140deg, #fcf1ea 0%, #f3e1d7 100%);
				color: var(--text-main);
			}

			.wrap {
				width: min(100%, 960px);
				background: var(--panel-bg);
				border: 1px solid var(--border);
				border-radius: 30px;
				padding: 32px;
				box-shadow: var(--shadow);
				display: grid;
				gap: 24px;
			}

			h1 {
				margin: 0;
				font-size: clamp(2rem, 4vw, 3.3rem);
			}

			.copy {
				margin: 12px 0 0;
				max-width: 56ch;
				line-height: 1.7;
				color: var(--text-soft);
			}

			.controls {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
				gap: 16px;
			}

			.control-card {
				background: var(--card-bg);
				border: 1px solid var(--border);
				border-radius: 22px;
				padding: 20px;
				display: grid;
				gap: 14px;
			}

			input,
			button {
				font: inherit;
			}

			input {
				padding: 14px 16px;
				border-radius: 14px;
				border: 1px solid var(--border);
			}

			button {
				border: none;
				border-radius: 999px;
				padding: 12px 18px;
				cursor: pointer;
				background: var(--accent);
				color: white;
			}

			.output-panel {
				background: white;
				border: 1px dashed var(--border);
				border-radius: 20px;
				padding: 18px;
				min-height: 88px;
			}

			.output-panel h2 {
				margin-top: 0;
			}

			#event-output {
				color: var(--text-soft);
				line-height: 1.6;
				white-space: pre-line;
			}
		</style>
	</head>
	<body>
		<main class="wrap">
			<section>
				<h1>Listening for events</h1>
				<p class="copy">
					Clicks, typing, and hover states live here so different event types are
					easy to compare.
				</p>
			</section>

			<section class="controls">
				<article class="control-card">
					<h2>Click event</h2>
					<button id="click-button">Click me</button>
				</article>

				<article class="control-card">
					<h2>Input event</h2>
					<input
						type="text"
						id="name-input"
						placeholder="Type your name here"
					/>
				</article>

				<article class="control-card" id="hover-card">
					<h2>Mouse event</h2>
					<p>Move over this card to trigger a mouse event example.</p>
				</article>
			</section>

			<section class="output-panel">
				<h2>Event output</h2>
				<p id="event-output">
					Event results can appear here or in the console.
				</p>
			</section>
		</main>
	</body>
</html>
