<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lesson 02 - Content and Attributes</title>
		<script src="./index.js" defer></script>
		<style>
			:root {
				--page-bg: #f2f6f1;
				--panel-bg: #fbfdf8;
				--card-bg: #ffffff;
				--text-main: #1d2a20;
				--text-soft: #5d6b60;
				--accent: #2f7d4f;
				--accent-soft: #dceedd;
				--border: #d3e2d4;
				--shadow: 0 24px 60px rgba(34, 84, 47, 0.12);
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				font-family: "Trebuchet MS", Verdana, sans-serif;
				background:
					linear-gradient(180deg, rgba(47, 125, 79, 0.08), transparent 36%),
					linear-gradient(135deg, #eef6ec 0%, #dcebdc 100%);
				color: var(--text-main);
			}

			.page {
				width: min(100%, 920px);
			}

			.card {
				background: var(--panel-bg);
				border: 1px solid var(--border);
				border-radius: 30px;
				padding: 32px;
				box-shadow: var(--shadow);
				display: grid;
				grid-template-columns: minmax(220px, 280px) 1fr;
				gap: 28px;
			}

			.poster {
				min-height: 300px;
				border-radius: 24px;
				background:
					linear-gradient(rgba(29, 42, 32, 0.22), rgba(29, 42, 32, 0.22)),
					url("https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=900&q=80")
						center / cover;
			}

			.meta {
				display: grid;
				gap: 16px;
				align-content: center;
			}

			.tag {
				width: fit-content;
				padding: 8px 12px;
				border-radius: 999px;
				background: var(--accent-soft);
				color: var(--accent);
				font-weight: 700;
				letter-spacing: 0.04em;
			}

			h1 {
				margin: 0;
				font-size: clamp(2rem, 4vw, 3.4rem);
				line-height: 1;
			}

			p {
				margin: 0;
				color: var(--text-soft);
				line-height: 1.7;
			}

			.detail-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
				gap: 14px;
			}

			.detail-box {
				background: var(--card-bg);
				border: 1px solid var(--border);
				border-radius: 18px;
				padding: 16px;
			}

			.detail-label {
				margin-bottom: 8px;
				font-size: 0.8rem;
				text-transform: uppercase;
				letter-spacing: 0.12em;
				color: var(--accent);
			}

			.detail-value {
				font-size: 1.05rem;
				font-weight: 700;
				color: var(--text-main);
			}

			@media (max-width: 760px) {
				.card {
					grid-template-columns: 1fr;
				}

				.poster {
					min-height: 220px;
				}
			}
		</style>
	</head>
	<body>
		<main class="page">
			<section class="card">
				<div
					class="poster"
					id="feature-image"
					data-state="original"
					aria-label="JavaScript workshop poster"
				></div>

				<div class="meta">
					<div class="tag" id="status-badge">Live session</div>
					<h1 id="session-title">DOM Workshop</h1>
					<p id="session-description">
						A simple content card with text, attributes, and data properties ready
						to update.
					</p>

					<div class="detail-grid">
						<div class="detail-box">
							<div class="detail-label">Duration</div>
							<div class="detail-value" id="session-duration">45 mins</div>
						</div>

						<div class="detail-box">
							<div class="detail-label">Level</div>
							<div class="detail-value" id="session-level">Beginner</div>
						</div>

						<div class="detail-box">
							<div class="detail-label">Room</div>
							<div class="detail-value" id="session-room" data-room="Lab A">
								Lab A
							</div>
						</div>
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
