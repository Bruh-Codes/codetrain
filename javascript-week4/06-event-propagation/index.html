<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lesson 06 - Event Propagation</title>
		<script src="./index.js" defer></script>
		<style>
			:root {
				--page-bg: #f3f4f8;
				--panel-bg: #fbfcff;
				--text-main: #1f2433;
				--text-soft: #61697b;
				--accent: #2d4ea2;
				--outer: #dbe5ff;
				--middle: #bfd1ff;
				--inner: #95b2ff;
				--border: #d6dced;
				--shadow: 0 24px 60px rgba(45, 78, 162, 0.12);
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				font-family: "Segoe UI", Geneva, sans-serif;
				background:
					radial-gradient(circle at top, rgba(45, 78, 162, 0.12), transparent 32%),
					linear-gradient(135deg, #f0f3f9 0%, #e4eaf4 100%);
				color: var(--text-main);
			}

			.page {
				width: min(100%, 980px);
				display: grid;
				gap: 22px;
			}

			.header,
			.logger {
				background: var(--panel-bg);
				border: 1px solid var(--border);
				border-radius: 28px;
				padding: 28px;
				box-shadow: var(--shadow);
			}

			h1,
			h2 {
				margin-top: 0;
			}

			p {
				line-height: 1.7;
				color: var(--text-soft);
			}

			.playground {
				display: grid;
				grid-template-columns: minmax(280px, 1fr) 320px;
				gap: 22px;
			}

			.nested-boxes {
				background: var(--panel-bg);
				border: 1px solid var(--border);
				border-radius: 28px;
				padding: 26px;
				box-shadow: var(--shadow);
				display: grid;
				place-items: center;
			}

			.layer {
				width: 100%;
				min-height: 150px;
				border-radius: 28px;
				display: grid;
				place-items: center;
				padding: 22px;
				font-weight: 700;
			}

			.outer-box {
				background: var(--outer);
			}

			.middle-box {
				background: var(--middle);
			}

			.inner-box {
				background: var(--inner);
				color: white;
			}

			#propagation-button {
				border: none;
				border-radius: 999px;
				padding: 14px 20px;
				font: inherit;
				font-weight: 700;
				cursor: pointer;
				background: white;
				color: var(--accent);
			}

			#log-list {
				margin: 0;
				padding-left: 20px;
				line-height: 1.8;
			}

			.tip {
				padding: 12px 14px;
				border-radius: 16px;
				background: #eef2ff;
				color: var(--accent);
				font-weight: 600;
			}

			@media (max-width: 860px) {
				.playground {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<main class="page">
			<section class="header">
				<h1>Event propagation</h1>
				<p>
					Nested layers make bubbling, capturing, `event.target`,
					`event.currentTarget`, and `stopPropagation()` easy to trace.
				</p>
			</section>

			<section class="playground">
				<div class="nested-boxes">
					<div class="layer outer-box" id="outer-box">
						Outer box
						<div class="layer middle-box" id="middle-box">
							Middle box
							<div class="layer inner-box" id="inner-box">
								<button id="propagation-button">Click the center button</button>
							</div>
						</div>
					</div>
				</div>

				<aside class="logger">
					<h2>Log panel</h2>
					<p class="tip">
						Predict the log order before adding any listeners.
					</p>
					<ul id="log-list">
						<li>Waiting for propagation logs...</li>
					</ul>
				</aside>
			</section>
		</main>
	</body>
</html>
